name: Code Checks

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - 'jest.config.cjs'
      - 'jest.setup.ts'
      - 'jest-transform.cjs'
      - '.github/workflows/code-checks.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - 'jest.config.cjs'
      - 'jest.setup.ts'
      - 'jest-transform.cjs'
      - '.github/workflows/code-checks.yaml'

jobs:
  type-check:
    name: TypeScript (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # Existing tests.yml uses `npm ci`; mirror that here to keep the
        # install reproducible against package-lock.json.
        run: npm ci

      - name: Type check
        # tsconfig has noEmit elsewhere via build pipeline; run an
        # explicit no-emit type check that fails on any type error.
        run: npx tsc --noEmit

      - name: Lint (ESLint + Prettier)
        # Conservative gate: eslint rules are mostly `warn`, prettier --check
        # blocks if formatting drifts. Promote warns to errors in a follow-up
        # once the codebase is at zero warnings.
        run: npm run lint

  test:
    name: Jest (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

      - name: Coverage summary
        if: success()
        run: |
          echo "### Jest Coverage" >> "$GITHUB_STEP_SUMMARY"
          cat coverage/coverage-summary.json | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const t = JSON.parse(data).total;
              console.log(`| Metric | Coverage |`);
              console.log(`|---|---|`);
              console.log(`| Lines | ${t.lines.pct}% (${t.lines.covered}/${t.lines.total}) |`);
              console.log(`| Statements | ${t.statements.pct}% (${t.statements.covered}/${t.statements.total}) |`);
              console.log(`| Branches | ${t.branches.pct}% (${t.branches.covered}/${t.branches.total}) |`);
              console.log(`| Functions | ${t.functions.pct}% (${t.functions.covered}/${t.functions.total}) |`);
            });
          ' >> "$GITHUB_STEP_SUMMARY"
