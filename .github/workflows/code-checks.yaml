name: Code Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same PR; never cancel push builds on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Detect what changed so docs/README/renovate-only PRs skip the heavy
  # TypeScript + Jest jobs. Path filtering happens here (not at the workflow
  # `on:` level) so the workflow always runs and the gated jobs report a
  # clean skip instead of leaving required checks pending.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      src: ${{ steps.filter.outputs.src }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            src:
              - 'src/**'
              - 'package.json'
              - 'tsconfig*.json'
              - 'jest*'
              - '*.config.*'
            workflows:
              - '.github/workflows/**'

  type-check:
    name: TypeScript (Node ${{ matrix.node }})
    needs: changes
    # Skip on draft PRs to save minutes; runs on ready-for-review, push, and
    # non-PR events (github.event.pull_request is null → not draft).
    if: ${{ (needs.changes.outputs.src == 'true' || needs.changes.outputs.workflows == 'true') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # Existing tests.yml uses `npm ci`; mirror that here to keep the
        # install reproducible against package-lock.json.
        run: npm ci

      - name: Type check
        # tsconfig has noEmit elsewhere via build pipeline; run an
        # explicit no-emit type check that fails on any type error.
        run: npx tsc --noEmit

      - name: Lint (ESLint + Prettier)
        # Conservative gate: eslint rules are mostly `warn`, prettier --check
        # blocks if formatting drifts. Promote warns to errors in a follow-up
        # once the codebase is at zero warnings.
        run: npm run lint

  test:
    name: Jest (Node ${{ matrix.node }})
    needs: changes
    # Skip on draft PRs to save minutes; runs on ready-for-review, push, and
    # non-PR events (github.event.pull_request is null → not draft).
    if: ${{ (needs.changes.outputs.src == 'true' || needs.changes.outputs.workflows == 'true') && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage:ci

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/

      - name: Coverage summary
        if: success()
        run: |
          echo "### Jest Coverage" >> "$GITHUB_STEP_SUMMARY"
          cat coverage/coverage-summary.json | node -e '
            let data = "";
            process.stdin.on("data", chunk => data += chunk);
            process.stdin.on("end", () => {
              const t = JSON.parse(data).total;
              console.log(`| Metric | Coverage |`);
              console.log(`|---|---|`);
              console.log(`| Lines | ${t.lines.pct}% (${t.lines.covered}/${t.lines.total}) |`);
              console.log(`| Statements | ${t.statements.pct}% (${t.statements.covered}/${t.statements.total}) |`);
              console.log(`| Branches | ${t.branches.pct}% (${t.branches.covered}/${t.branches.total}) |`);
              console.log(`| Functions | ${t.functions.pct}% (${t.functions.covered}/${t.functions.total}) |`);
            });
          ' >> "$GITHUB_STEP_SUMMARY"
