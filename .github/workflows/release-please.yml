name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Single root package: release-please emits the root-level
      # `release_created` when the release PR is merged.
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Manifest-driven configuration; release-please reads both files.
          token: ${{ secrets.GITHUB_TOKEN }}

  # Publish to public npmjs.com when release-please actually cuts a release
  # (i.e. the owner merges the release PR). Gated on `release_created` so it
  # never fires on ordinary pushes to main.
  publish-npm:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No build step: the package ships TypeScript source directly
      # (package.json main/types/exports all point at ./src/**), so there is
      # nothing to compile before publishing.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
            echo "$PKG@$VERSION already published; skipping."
          else
            npm publish --access public
          fi
